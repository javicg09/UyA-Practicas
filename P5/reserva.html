<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reserva | Taxis Tenerife</title>
    <link rel="icon" type="image/png" href="../img/icono.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <header class="bg-dark py-3 mb-4 shadow-sm">
        <div class="container d-flex align-items-center">
            <a href="./index.html" class="btn btn-outline-light btn-sm me-3">← Volver</a>
            <h1 class="text-white h4 mb-0">Reserva de Hotel </h1>
        </div>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="h4 mb-4 text-center fw-bold">Detalles de la Reserva</h2>

                        <div id="caja-errores" class="alert alert-danger" style="display: none;"></div>

                        <form id="form-reserva">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre completo *</label>
                                <input type="text" class="form-control" id="nombre">
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Correo electrónico *</label>
                                <input type="email" class="form-control" id="email" placeholder="tu@email.com">
                            </div>

                            <div class="row mb-3">
                                <div class="col">
                                    <label for="fecha_inicio" class="form-label">Fecha de llegada *</label>
                                    <input type="date" class="form-control" id="fecha_inicio">
                                </div>
                                <div class="col">
                                    <label for="fecha_fin" class="form-label">Fecha de Salida *</label>
                                    <input type="date" class="form-control" id="fecha_fin">
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="clientes" class="form-label">Nº de huéspedes:</label>
                                <input type="number" class="form-control" id="clientes" placeholder="1" min="1" max="20" value="1">
                            </div>

                            <div class="mb-3">
                                <label for="habitacion" class="form-label">Tipo de Habitación</label>
                                <select class="form-select" id="habitacion">
                                    <option value="individual">Individual (50 €/noche)</option>
                                    <option value="doble">Doble (80 €/noche)</option>
                                    <option value="suite">Suite (120 €/noche)</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label d-block">Servicios Extra</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="desayuno" value="desayuno">
                                    <label class="form-check-label" for="desayuno">Desayuno (10€/pax)</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="parking" value="parking">
                                    <label class="form-check-label" for="parking">Parking (15€/día)</label>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="descuento" class="form-label">Código de descuento</label>
                                <input type="text" class="form-control" id="descuento" placeholder="Ej: PROMO10">
                            </div>

                            <div class="alert alert-info text-center" id="precio-estimado">
                                <strong>Precio estimado: 0.00 €</strong>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg shadow-sm" id="btn-reservar">Reservar</button>
                                <button type="reset" class="btn btn-outline-secondary shadow-sm" id="btn-limpiar">Limpiar</button>
                            </div>
                        </form>

                        <div id="resumen" class="mt-4 p-3 border rounded bg-white shadow-sm" style="display: none;"></div>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
