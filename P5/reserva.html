<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reserva | Taxis Tenerife</title>
    <link rel="icon" type="image/png" href="../img/icono.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <header class="bg-dark py-3 mb-4 shadow-sm">
        <div class="container d-flex align-items-center">
            <a href="./index.html" class="btn btn-outline-light btn-sm me-3">← Volver</a>
            <h1 class="text-white h4 mb-0">Reserva de Hotel </h1>
        </div>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="h4 mb-4 text-center fw-bold">Detalles de la Reserva</h2>

                        <form>
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre completo</label>
                                <input type="text" class="form-control" id="nombre" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="email" placeholder="tu@email.com">
                            </div>

                            <div class="mb-4">
                                <label for="fecha_inicio" class="form-label">Fecha de llegada</label>
                                <br>
                                <input type="date" id="fecha_inicio" name="fecha">
                            </div>
                            <div class="mb-3">
                                <label for="fecha_fin" class="form-label">Fecha de Salida</label>
                                <br>
                                <input type="date" id="fecha_fin" name="fecha">
                            </div>
                            <div>

                            </div>
                            <div class="mb-3">
                                <label>Nº de pasajeros:</label>
                                <input type="number" name="pasajeros" placeholder="1" min="1" max="20">
                            </div>
                            <div class="mb-3">
                                <label for="habitacion"  class="conclase" >Habitacion</label>
                                <imput type="text" id="habitaciones" >
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg shadow-sm">Reservar</button>
                            </div>
                                <br>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg shadow-sm">limpiar</button>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
